name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Graphviz on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-liberation
      - name: Install Graphviz on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/14.1.0/windows_10_cmake_Release_Graphviz-14.1.0-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'graphviz.zip'
          $checksum = "$zip.sha256"
          Invoke-WebRequest -Uri "$url.sha256" -OutFile $checksum
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = [regex]::Match((Get-Content -LiteralPath $checksum -Raw), '[a-fA-F0-9]{64}').Value
          if (!$expected -or (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) {
            throw 'Unexpected Graphviz checksum'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'graphviz'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $dot = Get-ChildItem -LiteralPath $destination -Filter 'dot.exe' -Recurse | Select-Object -First 1
          if (!$dot) { throw 'Graphviz executable missing' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dot.DirectoryName
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: dot -V
      - run: python -m pytest
      - run: template-diagram generate --config examples/diagram.yaml --fail-on-warning
