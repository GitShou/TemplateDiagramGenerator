AWSTemplateFormatVersion: '2010-09-09'
Resources:
  ApplicationVPC:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.80.0.0/16}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref ApplicationVPC, CidrBlock: 10.80.1.0/24}
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref ApplicationVPC, CidrBlock: 10.80.2.0/24}
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {VpcId: !Ref ApplicationVPC, GroupDescription: Fictional application security group}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Subnets: [!Ref PublicA, !Ref PrivateB]
      SecurityGroups: [!GetAtt AppSecurityGroup.GroupId]
  WebTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {TargetType: ip, VpcId: !Ref ApplicationVPC, Port: 8080, Protocol: HTTP}
  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - {TargetGroupArn: !Ref WebTargets, Weight: 100}
  Cluster:
    Type: AWS::ECS::Cluster
  WebTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      ContainerDefinitions:
        - Name: web
          Image: public.ecr.aws/docker/library/nginx:stable
          PortMappings: [{ContainerPort: 8080}]
  WebService:
    Type: AWS::ECS::Service
    DependsOn: WebListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTask
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateB]
          SecurityGroups: [!GetAtt AppSecurityGroup.GroupId]
      LoadBalancers: [{TargetGroupArn: !Ref WebTargets, ContainerName: web, ContainerPort: 8080}]
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties: {DBSubnetGroupDescription: Fictional database group, SubnetIds: [!Ref PublicA, !Ref PrivateB]}
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      DBSubnetGroupName: !Ref DatabaseSubnets
      MasterUsername: exampleuser
      ManageMasterUserPassword: true
Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
