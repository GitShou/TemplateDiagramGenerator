AWSTemplateFormatVersion: '2010-09-09'
Resources:
  Schedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(10 minutes)
      State: ENABLED
      Targets:
        - Id: queue
          Arn: !GetAtt Queue.Arn
          DeadLetterConfig: {Arn: !GetAtt FailureQueue.Arn}
        - Id: function
          Arn: !GetAtt Worker.Arn
  Queue:
    Type: AWS::SQS::Queue
  FailureQueue:
    Type: AWS::SQS::Queue
  EnabledMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties: {EventSourceArn: !GetAtt Queue.Arn, FunctionName: !Ref Worker, Enabled: true}
  UnusedMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties: {EventSourceArn: !GetAtt FailureQueue.Arn, FunctionName: !Ref Worker, Enabled: false}
  Worker:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return None
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
