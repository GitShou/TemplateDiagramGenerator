[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "template-diagram-generator"
version = "0.2.0"
description = "Offline CloudFormation and Terraform architecture analysis and diagram generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "python-hcl2>=7.3,<8"]

[project.scripts]
template-diagram = "template_diagram_generator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
